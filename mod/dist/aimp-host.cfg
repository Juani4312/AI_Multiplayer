# aimp.cfg recomendado para el HOST (la partida que se juega es la suya). Ver INSTALACION.md.
AIMP_NET=host
AIMP_GHOST=3
AIMP_GHOST_WALK=1
AIMP_SYNC_USE=1
AIMP_SYNC_THROW=1
AIMP_SYNC_PICKUP=1
AIMP_SYNC_PINS=1
AIMP_SYNC_INV=1
AIMP_COOP_DOWNED=1
AIMP_COOP_SAVE_RULE=1
# trazas: solo agregan líneas al log (sirven para reportar problemas)
AIMP_TRACE_USE=1
AIMP_TRACE_PINS=1
AIMP_TRACE_PINS_MAX=300000
AIMP_TRACE_SAVE=1
AIMP_TRACE_DMG=1
